# Checks on every pull request. Fable ruling 11 (2026-07-26); two-job split per
# the CI triage ruling (2026-07-26, reports/briefs/FS_CI_TRIAGE_Prompt.md).
#
# TWO JOBS, ON PURPOSE.
#   1. "static gates": browser-free checks only. No Playwright browser is
#      installed here, so any gate that launches one crashes by construction.
#   2. "browser gates": the two self-contained browser gates (layout fit,
#      contrast). They serve the built dist themselves via vite preview, need
#      no dev server and no secrets, so they belong in CI, but they need the
#      chromium binary, which this job installs after npm ci. Blocking, same
#      security posture as job 1.
# WHY: layout_fit_gate.mjs and contrast_gate.mjs import chromium and were added
# to the browser-free static job; they crashed at chromium.launch() on every
# run since (runs 117 to 120 on main). A gate must run in an environment that
# can execute it, or its placement is the failure.
#
# SCOPE, still deliberately narrow. The Playwright suites that need a real dev
# server and a real environment (qa_soak, portrait_layout_conformance,
# currency_conformance, the proof scripts) stay local and in the external
# audit: they take tens of minutes and their value is in a real environment
# rather than in a CI container.
#
# SECURITY POSTURE. This repository is PUBLIC.
#   - This workflow receives NO secrets. There is no `secrets:` usage anywhere in
#     it, and nothing here needs credentials. Do not add any.
#   - `permissions` is contents:read only. It cannot write to the repository,
#     open or approve pull requests, or comment.
#   - It runs on `pull_request`, NOT `pull_request_target`, so a fork PR executes
#     with a read-only token and no access to repository secrets. This is the
#     important distinction on a public repo: `pull_request_target` would run
#     untrusted code with a privileged token.
#   - No auto-merge, no auto-fix, no comment-writing. Those UI options are OFF by
#     standing policy; this file must not reintroduce them by another route.
#
# Post-merge auto-archiving is ON as a repository setting; it is not this
# workflow's concern.
#
# NOT ADDED HERE ON PURPOSE: frontend/scripts/popout_conformance.mjs (R14). It
# asserts a REAL Playwright click at Stake's 400x225 mini-player size, which needs
# a browser and a dev server, so it stays local and in the external audit per this
# workflow's stated scope. Its result is committed as
# reports/qa/popout_conformance_2026-07-27.json.

name: checks

on:
  pull_request:
  # Also run on pushes to main so a merge that skipped review is still gated.
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: static gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          # fetch-depth: 0 so the locked-paths gate below can read the real
          # commit range. A shallow checkout has no base commit to diff against
          # and the gate would have to either guess or pass, and a gate that
          # passes when it cannot see is the exact failure convention (p) names.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ── Gate 0: LOCKED PATHS ─────────────────────────────────────────────────
      # FIRST AMONG THE GATES, because it is the only one whose subject is the
      # repository's own integrity rather than the code's. It sits after Set up
      # Node rather than before it so it runs on the pinned Node rather than
      # whatever the runner image happens to ship; it needs no npm dependencies,
      # so it still runs before the install.
      #
      # `.claude/settings.json`'s deny rules guard the Edit and Write TOOLS. They
      # do not guard git. CLAUDE.md records the near-miss in terms: a bulk purge
      # script walked src/ through Bash and wrote to a locked file, and no deny
      # rule fired, because a python loop is not the Edit tool. A `cp`, a `sed
      # -i`, a rebase resurrecting a reverted hunk or a merge carrying someone
      # else's change all reach a locked path the same way. This reads what
      # actually landed.
      #
      # A commit that legitimately changes a locked path carries, on its own line:
      #   LOCK-SANCTION: <YYYY-MM-DD> <locked-path>[, <locked-path>]...
      # naming exactly the locked paths it changes, checked in both directions.
      # Token format documented in CLAUDE.md beside the locks. (JOB 3h)
      - name: locked paths and track scope, self-test
        run: node scripts/qa/locked_paths_gate.mjs --self-test

      # MULTI-TRACK rule 3: parallel tracks require PROVABLY disjoint scopes.
      # Proved over every file git actually tracks, so it re-proves itself on
      # every run and a manifest widened later is caught the day it is widened,
      # rather than at the merge that discovers two tracks edited one file.
      - name: track manifests are disjoint
        run: node scripts/qa/locked_paths_gate.mjs --check-disjoint

      # The same script now carries the TRACK SCOPE rule too (MULTI-TRACK JOB 2):
      # on a branch named track/<name>, every changed file must match a glob in
      # docs/records/tracks/<name>.manifest. GITHUB_HEAD_REF is the PR's SOURCE
      # branch and is the one that carries the track name; GITHUB_REF_NAME on a
      # pull request is the merge ref and would never match track/<name>.
      #
      # GITHUB_HEAD_SHA is the PR's head BRANCH tip, and it is what the gate
      # ranges against. Actions checks out the MERGE ref, which carries the base
      # branch as it is NOW, so ranging base.sha..merge-ref blames the branch for
      # every commit the base branch gained after the event fired. That is what
      # failed run 30189226937 against a track that had touched neither file.
      # Taking the merge base alone does NOT fix it: base.sha is an ancestor of
      # the merge ref, so their merge base is base.sha. The head branch tip is
      # the fix, and the gate's seeded self-test plants all three forms.
      - name: locked paths and track scope
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: node scripts/qa/locked_paths_gate.mjs

      - name: Install frontend dependencies
        working-directory: frontend
        # `npm ci` is reproducible and fails if the lockfile is out of sync.
        # Playwright browsers are NOT installed: no suite here needs one.
        run: npm ci --ignore-scripts

      # ── Gate 1: type safety, regression-only ─────────────────────────────────
      # Fails if the error or warning count rises above the committed baseline.
      # See scripts/typecheck_baseline.mjs for why the baseline is not zero.
      - name: svelte-check (no new type errors)
        working-directory: frontend
        run: node scripts/typecheck_baseline.mjs

      # ── Gate 2: dead wiring ──────────────────────────────────────────────────
      # The standingMode class: state a control writes that nothing ever reads.
      - name: dead wiring scan
        working-directory: frontend
        run: node scripts/dead_wiring_scan.mjs

      # ── Gate 3: integer micros ───────────────────────────────────────────────
      # CLAUDE.md makes integer micros mandatory with zero float tolerance.
      - name: wallet float scan
        working-directory: frontend
        run: node scripts/scan_wallet_floats.mjs

      # ── Gate 4: money-path constant duplication ──────────────────────────────
      # CURRENCY_SCALE exists in the canonical util and in locked rgsService.ts.
      # Read-only: this parses the locked file as text and never writes to it.
      - name: currency scale drift
        working-directory: frontend
        run: node scripts/currency_scale_drift.test.mjs

      # ── Gate 5: frontend costs vs the shipped maths package ──────────────────
      # fsModes.ts against games/future_spinner/library/publish_files/index.json,
      # the two sides being independently generated. Guards the buy-tier billing
      # bug class. Read-only against the locked maths package.
      - name: fsModes / index.json drift
        working-directory: frontend
        run: npx tsx src/lib/config/fsModes.drift.test.ts

      # ── Gate 6: locale completeness ──────────────────────────────────────────
      # Every required key in all 16 locales, and no unexplained hardcoded
      # player-facing literal in any component. Kills the class where 18 strings
      # rendered English in fifteen locales because the keys never existed.
      - name: locale completeness
        working-directory: frontend
        run: node scripts/locale_completeness_check.mjs

      # ── Gate 6a: accessibility strings are social-safe ───────────────────────
      # Screen-reader text is player-facing text. The visible-text sweep reads
      # rendered DOM text and therefore never saw aria-label/title/alt, which is
      # how 14 control labels shipped carrying the restricted phrase "bet": a
      # blind player in a social jurisdiction heard the real-money vocabulary a
      # sighted player was protected from. (R4 / TR-012)
      - name: a11y social terms
        working-directory: frontend
        run: node scripts/a11y_social_terms_check.mjs

      # ── Gate 6b: the social vocabulary layer ─────────────────────────────────
      # The static half of the social gate. It re-derives the prohibited-term
      # table from the dated jurisdiction mirror and fails if the module's copy
      # has drifted, exercises sv() including case preservation and word
      # boundaries, and reads the three surfaces R2R3 named out of the SHIPPED
      # component source rather than a copy. The full rendered-DOM scan needs
      # Playwright and a dev server and so stays local, per this workflow's
      # stated scope; its result is committed as
      # reports/qa/social_dom_conformance_2026-07-25.json. (R2R JOB 6 / TR-041)
      - name: social vocabulary
        working-directory: frontend
        run: npx tsx src/lib/i18n/vocabulary.test.ts

      # ── Gate 7: no em or en dashes anywhere that can reach a player ──────────
      # Replaces player_string_dash_check.mjs, which passed twice while broken
      # (TR-060, then TR-063). The self-test runs FIRST and plants the four real
      # forms the old gate was blind to: if the gate cannot fail on a seeded
      # dash, its PASS means nothing. CLAUDE.md convention (p).
      - name: dash gate, seeded-violation self-test
        working-directory: frontend
        run: node scripts/dash_gate.mjs --self-test

      - name: dash gate, source scan
        working-directory: frontend
        run: node scripts/dash_gate.mjs --source

      # ── Gate 7a: the machine-tell gate ───────────────────────────────────────
      # The second gate of the dash gate's family, added 2026-07-27 by the
      # quality sweep. CLAUDE.md's STANDING MANDATE ends "Nothing player-visible
      # may read as machine-generated" and its inspection test names the
      # specific failures; docs/QUALITY_CHARTER.md holds the full list and this
      # enforces the sweepable subset: emoji and dingbats typeset as icons,
      # scaffold placeholders, double spaces, one locale using both apostrophe
      # forms, a French elision missing its apostrophe, hardcoded currency
      # symbols, and player money rendered by .toFixed() outside the canonical
      # formatter.
      #
      # WHAT IT FOUND ON ITS FIRST RUN, so the gate's value is on the record:
      # 35 symbol glyphs shipping in dist, 31 of them player-visible, and
      # `<title>future-spinner-frontend</title>`, the Vite starter's own package
      # name, as the pre-hydration browser tab title (transient: App.svelte's
      # <svelte:head> replaces it on mount, which the first assessment missed).
      #
      # Self-test first, per convention (p). Every one of its ten seeds is a
      # string that was really in this repository at HEAD 3f0d686, in the file
      # shape it was found in, not an invented example of the class. Eight
      # negative controls, two of which encode corrections the gate's own first
      # real run forced.
      - name: machine tell gate, seeded-violation self-test
        working-directory: frontend
        run: node scripts/machine_tell_gate.mjs --self-test

      - name: machine tell gate, source scan
        working-directory: frontend
        run: node scripts/machine_tell_gate.mjs --source

      # ── Gate 8: authenticated bet ladder ─────────────────────────────────────
      # Both bet-changing surfaces must drive from the RGS-supplied levels. The
      # first three assertions reproduce the shipped defect arithmetically:
      # off the authenticated ladder, "+" dropped the bet to 0.10. (R5/TR-013)
      - name: bet ladder model
        working-directory: frontend
        run: npx tsx src/lib/stores/betLadder.test.ts
      # ── Gate 9: responsible-gambling enforcement ─────────────────────────────
      # Jurisdiction flags must be ENFORCED, not merely derived. turboDisabled
      # previously had zero readers anywhere: the flag was computed correctly and
      # every consumer ignored it, so a market banning fast play still got it.
      # (R7/TR-015)
      - name: responsible gambling enforcement
        working-directory: frontend
        run: npx tsx src/lib/stores/responsibleGambling.test.ts

      # ── Gate 10: modal safety and per-tier buy affordability ─────────────────
      # Blocking surfaces register themselves instead of being listed in
      # App.svelte, which could not see component-local state and so let the
      # spacebar spin under six of them. Affordability is checked against the
      # tier's real cost, not a flat 100x. (R8/TR-016)
      - name: modal guard and buy affordability
        working-directory: frontend
        run: npx tsx src/lib/stores/modalGuard.test.ts

      # ── Gate 10a: production mock containment (source half) ──────────────────
      # rgsService falls through to _mockSpin() when _rgsMode is false, which it
      # sets on a real auth failure as well as the dev case. The bundle half of
      # this gate needs a build and runs in the closing suite. (R2/TR-010)
      - name: live guard
        working-directory: frontend
        run: npx tsx src/lib/stores/liveGuard.test.ts

      # ── Gate 10b: session recovery ───────────────────────────────────────────
      # authenticate reports an in-progress round and initRGS discarded it. On a
      # pending_end round that is an uncredited win. (R11/TR-017)
      - name: session recovery
        working-directory: frontend
        run: npx tsx src/lib/stores/sessionRecovery.test.ts

      # ── Gate 10c: scatter anticipation integrity ─────────────────────────────
      # The escalation level must be a function of VISIBLE state only. The test
      # asserts, among other things, that two rounds identical so far escalate
      # identically however they end - which is the property that makes the
      # build honest rather than a tell.
      - name: scatter anticipation
        working-directory: frontend
        run: npx tsx src/lib/stores/scatterEscalation.test.ts

      # ── Gate 10d: official launch parameters ─────────────────────────────────
      # The official launch sends sessionID; App.svelte read only `session`, so a
      # real launch authenticated with a dev token, failed, and the live guard
      # then correctly refused to bet. Unplayable on a real URL. (R2R blocker 1)
      - name: launch params
        working-directory: frontend
        run: npx tsx src/lib/stores/launchParams.test.ts

      # ── Gate 11: live event schema alignment ─────────────────────────────────
      # The locked parser looked for board/win/scatter events. Across the first
      # 300 shipped base rounds those occur 0, 0 and 0 times, while reveal occurs
      # 724 times. Asserted against real decoded book rows. (R1a/TR-009)
      - name: rgs parse alignment
        working-directory: frontend
        run: npx tsx src/lib/services/rgsService.parse.test.ts

      # ── Gate 11a: official wallet contract ───────────────────────────────────
      # Every raw shape in rgsService.ts was invented: flat authenticate, flat
      # play, an end-round that sent and read a roundId the platform neither
      # accepts nor returns, and an rgs_url used unprefixed so requests never
      # left our own origin. Asserted against fixtures transcribed from the
      # pinned ts-client (df9e126), importing the real functions rather than
      # restating them. (R2R JOB 4 / TR-039, TR-042)
      - name: wallet contract
        working-directory: frontend
        run: npx tsx src/lib/services/rgsService.contract.test.ts

      # ── Gate 12: currency display contract ───────────────────────────────────
      # Static subset of the currency conformance harness: no browser, no dev
      # server. Asserts the raw platform code is never player-facing, trailing
      # SC/GC placement per ruling 2, zero-decimal currencies, and no US$ prefix.
      - name: currency static assertions
        working-directory: frontend
        run: npx tsx src/lib/utils/currency.test.ts

      # ── Gate 12a: social mode forces English ─────────────────────────────────
      # Stake Engine testing guideline item 46, quoted: "English is the only
      # supported language in Social Mode". It is written as a requirement on
      # the game, so the game enforces it rather than trusting the platform to
      # only ever send `en`. TR-067: the social flag selected the VOCABULARY
      # variant and never touched the LOCALE, so a social session launched with
      # lang=de rendered German chrome wearing social wording. The named case is
      # a social `da` launch, which exercises the forcing and the
      # unshipped-locale fallback at once, Danish being offered by the
      # platform's own Language menu and not one of our sixteen (TR-059).
      # The browser half lives in scripts/locale_launch_conformance.mjs.
      - name: social mode forces English
        working-directory: frontend
        run: npx tsx src/lib/stores/socialLocale.test.ts

      # ── Gate 13: replay through the canonical interpreter ────────────────────
      # ReplayMode used the canonical interpreter only for freeSpinTrigger
      # rounds and searched every ORDINARY round for board/win/scatter, which
      # occur zero times in the shipped books, so a loss or a base win replayed
      # as an empty static grid. Mandatory platform requirement. Asserted over
      # five categories in every mode that has them, against real book rounds
      # committed as fixtures, plus a source scan proving the legacy search has
      # not come back. (R2R JOB 5 / TR-040)
      - name: replay rounds
        working-directory: frontend
        run: npx tsx src/lib/services/replayRounds.test.ts

      # ── Gate 1a: the COMPLETE type-check, not just the Svelte half ───────────
      # R2R3 finding 9 / TR-046: "npm run check reports 0 Svelte errors, 36
      # warnings and vite.config.ts:33 TS7006. CI runs only the Svelte baseline,
      # so TR-018's 'baseline is zero and CI enforces it' is incomplete." It was
      # right: gate 1 runs typecheck_baseline.mjs, which is svelte-check alone,
      # and the tsc half of `npm run check` had been red the whole time. The
      # TS7006 is fixed and the whole command now runs here, so the claim and
      # the gate finally agree.
      - name: npm run check (svelte-check AND tsc)
        working-directory: frontend
        run: npm run check

      # ── Gate 1b: the production build ────────────────────────────────────────
      # Also R2R3 finding 9, which asked for "the complete command green and run,
      # plus a production build, in CI". A build catches what no type-check can:
      # a broken import chain, a missing asset, a plugin that throws at
      # closeBundle. It is also what every Playwright proof that serves `dist`
      # depends on existing, so a build failure here is a failure of half the
      # evidence pipeline.
      - name: production build
        working-directory: frontend
        run: npm run build

      # ── Gate 13b: the dash gate's dist scan ──────────────────────────────────
      # Runs after the build because dist is the authority: it catches a dash
      # however it was authored, including in a public asset that no scan of
      # src/ could ever see. Its first run found 17 in a shipped sounds README.
      - name: dash gate, dist scan
        working-directory: frontend
        run: node scripts/dash_gate.mjs

      # ── Gate 13b2: the machine-tell gate's dist scan ─────────────────────────
      # Same reasoning as the dash gate's dist scan directly above: dist is the
      # authority because a glyph is a glyph however it was authored, and the
      # tab title is read straight out of the shipped HTML rather than inferred
      # from the source that produced it.
      - name: machine tell gate, dist scan
        working-directory: frontend
        run: node scripts/machine_tell_gate.mjs

      # Gates 13c and 13d (layout fit, contrast) live in the "browser gates"
      # job below: they launch chromium, which this job deliberately does not
      # install. See the header for the two-job policy.

      # ── Gate 13e: no documentation ships ─────────────────────────────────────
      # JOB 3(i). vite.config.ts's pruneDocs deletes documentation from dist at
      # closeBundle; this asserts it is not there, and the two are deliberately
      # separate. A plugin that stops running, or has a path edited, fails
      # silently and the bundle quietly carries the file again, which is how
      # build_diet_verify.mjs sat broken for ten days while its committed result
      # was cited as compliance evidence. This reads dist as it stands and knows
      # nothing about how it got that way.
      #
      # What was shipping: an audio generation-notes README naming the model,
      # the seeds, the prompts and the licence paths, served from the portal in
      # the owner's own 104-file listing. Ships a seeded violation whose first
      # seed is that exact path. Also re-records the bundle figure against the
      # 25 MB budget, so the number in the report is one this script computed.
      - name: dist hygiene, no documentation ships
        working-directory: frontend
        run: node scripts/dist_hygiene_gate.mjs

      # ── Gate 14: the books verifier fails closed ─────────────────────────────
      # Run at HEAD with the private books absent, the verifier produced five
      # `zstd: can't stat` errors, processed zero rounds, made zero assertions
      # and printed PASS. The books are gitignored, so that is what EVERY
      # reviewer working from this repository got. The self-test runs the tool
      # against absent input and asserts a non-zero exit, which is the one proof
      # that cannot rot, and it needs no books, so it belongs in CI where the
      # books are always absent. (R2R JOB 7 / TR-044)
      - name: books verifier self-test
        run: python3 tools/verify_books_lookup_equality.py --self-test

  # The second job of the two-job policy (see header). Only the gates that
  # launch chromium live here. Blocking, no secrets, contents:read only, same
  # pull_request trigger, exactly like the static job.
  # timeout-minutes is 10 on Fable's mid-session direction after run 122: the
  # layout gate finished its work in 13 seconds, printed PASS, and then hung
  # for 18 minutes because killing its npx wrapper orphaned the vite preview,
  # whose inherited stdout pipe held the node event loop open. Both gates now
  # also carry a 4-minute internal watchdog and an explicit process.exit, so a
  # hang is a loud red at three layers before a human has to cancel anything.
  # timeout-minutes raised 10 to 20 by FS VISUAL FIXPACK, which adds three
  # browser gates and their three self-tests. Measured locally: splash calm 70s
  # plus 31s self-test, turbo intensity 20s plus 10s, paytable card fill 55s
  # plus 9s, so about 3.3 minutes of new work on a machine faster than the
  # runner. The 10-minute figure was set after run 122's hang, and raising it
  # does not weaken that: each of these gates carries its OWN internal watchdog
  # (4 to 8 minutes) that exits red, which is the level the run-122 note itself
  # argues a hang should be caught at. The job timeout is the last resort, not
  # the first.
  browser:
    name: browser gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts

      # The one step the static job deliberately lacks: the chromium binary.
      # --with-deps also installs the OS libraries chromium needs on the
      # runner image. No other browser is installed; the gates use chromium.
      - name: Install chromium
        working-directory: frontend
        run: npx playwright install chromium --with-deps

      # Both gates serve dist via vite preview, so the build must exist first.
      # The static job builds too; duplicating the build here keeps the two
      # jobs independent, which is the point of the split.
      - name: production build
        working-directory: frontend
        run: npm run build

      # ── Gate 13c: the frame FITS at all seven platform presets ───────────────
      # Guideline item 15. Asserts two independent things, because satisfying one
      # by breaking the other is exactly how this nearly went wrong: the frame
      # must not scroll, AND every interactive control must lie inside its
      # clipping ancestor. Changing overflow to hidden would have passed the
      # first and silently failed the second (TR-069). The seven viewports are
      # the platform's own, read off the DTT Screen menu. (JOB 3b, TR-065/069/071)
      - name: layout fit gate, seven presets
        working-directory: frontend
        run: node scripts/layout_fit_gate.mjs

      # ── Gate 13d: text contrast, measured on composited pixels ───────────────
      # TR-070. The portrait FEATURES bar sits over the background art behind a
      # plate whose gradient starts at 10% opacity, so the contrast a player
      # experiences is against whatever the art happens to be there. No
      # stylesheet states that value; only a screenshot knows it. The gate hides
      # the glyphs, screenshots the exact box, decodes it through the browser's
      # own canvas and reports the ratio against the WORST pixel rather than the
      # average, because a player does not read the average. WCAG 2.1 AA, 4.5:1
      # for normal text; the label is 12px, so that is the applicable figure.
      # Ships a seeded violation per convention (p). (JOB 3g)
      - name: contrast gate, portrait presets
        working-directory: frontend
        run: node scripts/contrast_gate.mjs

      # ── Gate 13f: the boot screens are CALM ──────────────────────────────────
      # FS VISUAL FIXPACK JOB 1. The load screen's brand mark rotated because
      # commit 54544e4 replaced a two-layer rim+blade composite with a single
      # canonical logo and left the blade's `brand-spin` animation sitting on it.
      # The artwork is not radially symmetric, so the mark's bounding box swung
      # 77px at Desktop and 98px at Popout S: the owner's "jumps around and
      # starts spinning" was one defect, not two.
      #
      # A still frame cannot assert this, because a photograph of a rotating
      # logo looks like a logo. The gate samples geometry every 250ms across ten
      # seconds at three presets and asserts zero variance, no rotation, no
      # translation, and no animation writing `transform` on any boot logo. The
      # permitted gentle pulse animates opacity or filter, which is why it can
      # assert exactly zero rather than "not much". Self-test first, per
      # convention (p); it plants the real rotation and must go red on it.
      - name: splash calm gate, seeded-violation self-test
        working-directory: frontend
        run: node scripts/splash_calm_gate.mjs --self-test

      - name: splash calm gate, boot logos still
        working-directory: frontend
        run: node scripts/splash_calm_gate.mjs

      # ── Gate 13g: the three speeds are distinguishable ───────────────────────
      # FS VISUAL FIXPACK JOB 2. The owner removed the "1x / 2x / 4x" numeral
      # from the speed control, so intensity is now the ONLY thing separating
      # Normal, Turbo and Super Turbo. Before this pass the control lit on a
      # single boolean and the top two tiers were styled identically, which
      # means deleting the numeral without measuring would have shipped two
      # speeds a player cannot tell apart.
      #
      # The gate screenshots the real composited control at each speed at all
      # seven presets, decodes it through the browser's canvas, and asserts the
      # mean WCAG relative luminance rises monotonically with a real contrast
      # step between adjacent states, plus that no numeral has come back. The
      # measured floor on the shipped design is 1.30:1 against a 1.25:1 bar.
      # Self-test first per convention (p): it flattens Super Turbo back to
      # Normal (the exact shape of the old boolean) and puts the numeral back.
      - name: turbo intensity gate, seeded-violation self-test
        working-directory: frontend
        run: node scripts/turbo_intensity_gate.mjs --self-test

      - name: turbo intensity gate, seven presets
        working-directory: frontend
        run: node scripts/turbo_intensity_gate.mjs

      # ── Gate 13h: a card's fill encloses its content ─────────────────────────
      # FS VISUAL FIXPACK JOB 3. The paytable's card primitive is a chrome FRAME
      # with a dark FILL child. The frame was a block container, so the fill was
      # only ever as tall as its own content, and .fs-sym-grid stretches its
      # items to the row height. On a row with a taller card the frame grew and
      # the fill did not: WILD showed 23.0px of bare chrome and SCAT 36.9px.
      # The mode cards had it too, at 15.4px, unreported.
      #
      # Asserted in BOTH directions across all sixteen locales, because a fix
      # can fail either way: the fill must cover the frame (the shipped defect),
      # AND every text box and image must sit inside the fill (the defect a
      # fixed-height fill would introduce instead). The locale list is derived
      # from the shipped Locale union, so a seventeenth locale is covered the day
      # it lands. Convention (p) --self-test plants both forms, and seed 1
      # reproduces the shipped numbers to two decimal places.
      - name: paytable card fill gate, seeded-violation self-test
        working-directory: frontend
        run: node scripts/paytable_card_fill_gate.mjs --self-test

      - name: paytable card fill gate, all sixteen locales
        working-directory: frontend
        run: node scripts/paytable_card_fill_gate.mjs

      # ── Gate 13i: a full-screen scrim covers the full screen ─────────────────
      # FS VISUAL FIXPACK JOB 4. `.game-wrapper` carries transform: scale on
      # desktop, and a transform makes an element the containing block for its
      # position:fixed DESCENDANTS, so every dialog scrim resolved `inset: 0` to
      # the 1280x720 STAGE rather than the viewport. That is invisible at 16:9,
      # because then the stage IS the viewport, and leaves the letterbox bands
      # bare at every other window shape: measured 266.67px uncovered at
      # 1600x600, 196.88px at 900x900, 180.63px at 1100x980. Exactly the owner's
      # "at some sizes the corners show through".
      #
      # Ten scrims now share ONE implementation, .fs-scrim in src/app.css. The
      # gate asserts all three of: the shared rule exists and does not shrink
      # itself by the safe-area insets; no component hand-rolls scrim geometry
      # (read out of the source, because the point is that it must not be
      # WRITTEN); and zero uncovered pixels by rect AND by hit-testing forty
      # points one pixel inside every edge, at seven presets and three swept
      # sizes. Convention (p) --self-test plants the re-anchored scrim and the
      # inset-shrunk scrim.
      - name: scrim coverage gate, seeded-violation self-test
        working-directory: frontend
        run: node scripts/scrim_coverage_gate.mjs --self-test

      - name: scrim coverage gate, seven presets plus three swept sizes
        working-directory: frontend
        run: node scripts/scrim_coverage_gate.mjs
