# Checks on every pull request. Fable ruling 11 (2026-07-26); two-job split per
# the CI triage ruling (2026-07-26, reports/briefs/FS_CI_TRIAGE_Prompt.md).
#
# TWO JOBS, ON PURPOSE.
#   1. "static gates": browser-free checks only. No Playwright browser is
#      installed here, so any gate that launches one crashes by construction.
#   2. "browser gates": the two self-contained browser gates (layout fit,
#      contrast). They serve the built dist themselves via vite preview, need
#      no dev server and no secrets, so they belong in CI, but they need the
#      chromium binary, which this job installs after npm ci. Blocking, same
#      security posture as job 1.
# WHY: layout_fit_gate.mjs and contrast_gate.mjs import chromium and were added
# to the browser-free static job; they crashed at chromium.launch() on every
# run since (runs 117 to 120 on main). A gate must run in an environment that
# can execute it, or its placement is the failure.
#
# SCOPE, still deliberately narrow. The Playwright suites that need a real dev
# server and a real environment (qa_soak, portrait_layout_conformance,
# currency_conformance, the proof scripts) stay local and in the external
# audit: they take tens of minutes and their value is in a real environment
# rather than in a CI container.
#
# SECURITY POSTURE. This repository is PUBLIC. It was briefly made private on
# 2026-07-29 while the root licence was corrected (an inherited MIT grant naming
# Stake Engine sat over original work; scoped now at THIRD_PARTY_LICENSES.md) and
# was returned to public the same day, because the Product Owner reviews it by
# fetching unauthenticated URLs and cannot read a private repository.
#
# The posture below is UNCHANGED across all of that, deliberately: a workflow that
# needs no secrets should neither acquire them when the repository is private nor
# relax when it is public. Do not add any.
#   - This workflow receives NO secrets. There is no `secrets:` usage anywhere in
#     it, and nothing here needs credentials. Do not add any.
#   - `permissions` is contents:read only. It cannot write to the repository,
#     open or approve pull requests, or comment.
#   - It runs on `pull_request`, NOT `pull_request_target`, so a fork PR executes
#     with a read-only token and no access to repository secrets. This is the
#     important distinction on a public repo: `pull_request_target` would run
#     untrusted code with a privileged token.
#   - No auto-merge, no auto-fix, no comment-writing. Those UI options are OFF by
#     standing policy; this file must not reintroduce them by another route.
#
# EXPECTED RUN TIMES, so a slow run is knowledge rather than alarm. Also recorded
# beside rule 10 in CLAUDE.md, which is where someone reading a red or slow run
# will look first. MEASURED, not predicted, on run 30281432163:
#
#   static gates                    ~82s
#   browser: layout fit             ~74s      browser: contrast          ~100s
#   browser: paytable card fill    ~114s      browser: splash calm       ~154s
#   browser: win count-up steady   ~170s      browser: turbo intensity   ~217s
#   browser: scrim coverage        ~276s   <- sets the wall-clock
#
#   TOTAL WALL-CLOCK: 2.9 to 4.6 minutes across two runs, down from 6.4.
#   The spread is runner CONTENTION, not our code: the same scrim gate took
#   276s on run 30281432163 and 173s on 30281912392. Judge a run against the
#   range, never against a single remembered number.
#
# TWO ASSUMPTIONS WERE WRONG ON THE WAY HERE AND BOTH ARE KEPT ON THE RECORD,
# because the useful knowledge is which levers did NOT work.
#
#   1. Caching chromium was expected to be the win. The cache hits correctly and
#      cuts the install from ~90s to 12s, and the job stayed at 6.4 minutes: the
#      install was never the dominant cost. The gates were, at 314s of 380s.
#   2. Splitting the gates one-per-job was then predicted to give ~2.7 minutes,
#      i.e. setup plus the slowest gate. It gave 4.6. Seven concurrent legs
#      CONTEND for runner resources, so each leg runs slower than it does alone:
#      turbo intensity measures 24s of gate work and took 217s wall-clock.
#      Parallelism on shared runners is not free and does not divide cleanly.
#
# So the honest figure is 6.4 down to 4.6, a 28 per cent improvement, plus a
# diagnostic gain that is arguably worth more than the seconds: a red check now
# NAMES the gate that failed, without anyone opening a log.
#
# A cache MISS is expected on the first run after a Playwright bump, since the
# key carries the RESOLVED version. Both a hit and a miss are normal.
#
# A NOTE ON `cancelled` RUNS, because rule 10 says an unexplained non-green is
# treated as real and that is only worth something if the explainable ones are
# explained. `concurrency: cancel-in-progress` below cancels an in-flight run
# when a newer commit lands on the same ref. So a rapid sequence of pushes
# leaves some commits with a cancelled run rather than a green one. The CONTENT
# is still tested, by the next commit's run, because the later commit contains
# it; but the per-commit record has gaps. That is a deliberate trade of record
# completeness for runner minutes. If per-commit greens ever matter more than
# minutes, set cancel-in-progress to false for pushes to main.
#
# Post-merge auto-archiving is ON as a repository setting; it is not this
# workflow's concern.
#
# A DATED RECORD, superseded 2026-08-11 (TR-123): from R14 to 2026-08-11 this
# header said popout_conformance was NOT added on purpose, because it needs a
# browser and a dev server and this workflow was browser-free when R14 wrote
# that. The browser matrix has existed since 2026-07-26, so the stated reason
# had lapsed; what actually kept popout (and social_dom, social_string) out was
# that all three printed their verdict and never exited (the R043 closure
# suite's lingering-handle observation). TR-123 gave the family clean exit
# semantics and seeded self-tests, and all three are wired as browser legs
# below.

name: checks

on:
  pull_request:
  # Also run on pushes to main so a merge that skipped review is still gated.
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── WHAT CHANGED, added 2026-07-29 ────────────────────────────────────────
  #
  # The repository went private, so Actions minutes are metered. A push bills
  # 24.1 MINUTES across 12 parallel jobs while taking 3.3 minutes of wall
  # clock, because each job bills separately. Most pushes here are documents
  # and touch no rendering code at all.
  #
  # THE OBVIOUS FIX IS THE WRONG ONE. A workflow-level `paths-ignore` would
  # skip the STATIC job too, and that job carries the document currency gate,
  # the dash gate and the locked-paths gate. Filtering out documents would
  # disable precisely the gates whose job is to check documents. So the static
  # job is NEVER gated, and only the browser matrix is.
  #
  # IT FAILS OPEN, ALWAYS. No base, an unknown base, a first push, a git error:
  # every one of those runs the full matrix. The cost of skipping a gate that
  # should have run is invisible, and this project has already shipped three
  # gates that printed PASS over live defects. Burning minutes is the cheaper
  # mistake and it is the one this is biased towards.
  changes:
    name: what changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      browser_needed: ${{ steps.filter.outputs.browser_needed }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether the browser matrix is needed
        id: filter
        run: |
          set -u
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi

          # Fail open on anything unexpected.
          if [ -z "${BASE}" ] \
             || [ "${BASE}" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "no usable base ref, running the full matrix"
            echo "browser_needed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED=$(git diff --name-only "${BASE}" "${{ github.sha }}") || {
            echo "git diff failed, running the full matrix"
            echo "browser_needed=true" >> "$GITHUB_OUTPUT"
            exit 0
          }

          echo "changed files:"
          echo "${CHANGED}"

          # Anything that can alter what RENDERS, what SHIPS, or how a gate is
          # run. scripts/ is included because the gates themselves live there.
          if echo "${CHANGED}" | grep -qE '^(frontend/|games/|design-system/|scripts/|\.github/workflows/|package\.json|package-lock\.json)'; then
            echo "browser_needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "documents only, skipping the browser matrix"
            echo "browser_needed=false" >> "$GITHUB_OUTPUT"
          fi

  static:
    name: static gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          # fetch-depth: 0 so the locked-paths gate below can read the real
          # commit range. A shallow checkout has no base commit to diff against
          # and the gate would have to either guess or pass, and a gate that
          # passes when it cannot see is the exact failure convention (p) names.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ── Gate 0: LOCKED PATHS ─────────────────────────────────────────────────
      # FIRST AMONG THE GATES, because it is the only one whose subject is the
      # repository's own integrity rather than the code's. It sits after Set up
      # Node rather than before it so it runs on the pinned Node rather than
      # whatever the runner image happens to ship; it needs no npm dependencies,
      # so it still runs before the install.
      #
      # `.claude/settings.json`'s deny rules guard the Edit and Write TOOLS. They
      # do not guard git. CLAUDE.md records the near-miss in terms: a bulk purge
      # script walked src/ through Bash and wrote to a locked file, and no deny
      # rule fired, because a python loop is not the Edit tool. A `cp`, a `sed
      # -i`, a rebase resurrecting a reverted hunk or a merge carrying someone
      # else's change all reach a locked path the same way. This reads what
      # actually landed.
      #
      # A commit that legitimately changes a locked path carries, on its own line:
      #   LOCK-SANCTION: <YYYY-MM-DD> <locked-path>[, <locked-path>]...
      # naming exactly the locked paths it changes, checked in both directions.
      # Token format documented in CLAUDE.md beside the locks. (JOB 3h)
      - name: locked paths and track scope, self-test
        run: node scripts/qa/locked_paths_gate.mjs --self-test

      # MULTI-TRACK rule 3: parallel tracks require PROVABLY disjoint scopes.
      # Proved over every file git actually tracks, so it re-proves itself on
      # every run and a manifest widened later is caught the day it is widened,
      # rather than at the merge that discovers two tracks edited one file.
      - name: track manifests are disjoint
        run: node scripts/qa/locked_paths_gate.mjs --check-disjoint

      # The same script now carries the TRACK SCOPE rule too (MULTI-TRACK JOB 2):
      # on a branch named track/<name>, every changed file must match a glob in
      # docs/records/tracks/<name>.manifest. GITHUB_HEAD_REF is the PR's SOURCE
      # branch and is the one that carries the track name; GITHUB_REF_NAME on a
      # pull request is the merge ref and would never match track/<name>.
      #
      # GITHUB_HEAD_SHA is the PR's head BRANCH tip, and it is what the gate
      # ranges against. Actions checks out the MERGE ref, which carries the base
      # branch as it is NOW, so ranging base.sha..merge-ref blames the branch for
      # every commit the base branch gained after the event fired. That is what
      # failed run 30189226937 against a track that had touched neither file.
      # Taking the merge base alone does NOT fix it: base.sha is an ancestor of
      # the merge ref, so their merge base is base.sha. The head branch tip is
      # the fix, and the gate's seeded self-test plants all three forms.
      - name: locked paths and track scope
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: node scripts/qa/locked_paths_gate.mjs

      # DOCUMENT CURRENCY, built 2026-07-29 to docs/records/DOC_CURRENCY_GATE_SPEC.md.
      #
      # A committed document may not make a claim that is no longer true of HEAD.
      # A stale line in COMPLIANCE_WATCH.md was read as evidence by the Head of
      # Engineering, written into a brief as an instruction, and reached the next
      # session's boot as a VERIFIED premise. Three readers trusted the document
      # and the document was wrong. A reader has no cheap way to know a prose line
      # is stale; this does.
      #
      # THE SELF-TEST RUNS FIRST, AS ITS OWN STEP, and that ordering is the point.
      # A gate that has lost the ability to fail is a script that prints PASS, and
      # this project has produced that failure four separate times with a green
      # gate sitting over it. Running the seeds here means CI catches it rather
      # than a reviewer reading the regex four days later.
      #
      # It needs the full history that fetch-depth: 0 above already provides: the
      # dead-commit class asks git to resolve every SHA the documents cite, and on
      # a shallow clone every one of them would read as dead.
      - name: document currency, seeded-violation self-test
        run: node scripts/qa/doc_currency_gate.mjs --self-test

      # Session 3 JOB 4, cluster S2-C098. kit_build.mjs already ships a seeded
      # self-test and nothing ran it, while sixteen other gates run theirs. It is
      # CI-safe by construction: the --self-test branch exits before treeFacts(),
      # so it never reaches the two tree refusals, which cannot fire in CI at all
      # (a checkout is always clean, and a pull request HEAD is a synthetic merge
      # commit on no remote branch). Only the self-test is wired, deliberately:
      # wiring --check would ship a step that can only print PASS.
      - name: kit build, seeded-violation self-test
        run: node scripts/kit_build.mjs --self-test

      # The scan honours scripts/qa/doc_currency_baseline.json, the frozen debt
      # that existed when the gate went live (FULL_AUDIT_METHOD.md 3.1). The
      # frozen count PRINTS on every run, because a gate quietly excusing several
      # hundred claims reads exactly like a gate with nothing to excuse. The list
      # is checked in both directions, so an entry that stops matching fails too.
      - name: document currency scan
        run: node scripts/qa/doc_currency_gate.mjs

      - name: Install frontend dependencies
        working-directory: frontend
        # `npm ci` is reproducible and fails if the lockfile is out of sync.
        # Playwright browsers are NOT installed: no suite here needs one.
        run: npm ci --ignore-scripts

      # ── Gate 0b: the supply chain, S2-C049, S2-C051, part of S2-C048 ─────────
      # Runs against the RESOLVED lockfile, immediately after `npm ci` so the
      # tree it describes is the tree that was just installed. The self-test
      # runs first, per the house shape: a gate that has never been seen to fail
      # is a script that prints PASS.
      #
      # The advisory half needs the registry and fails closed without it, which
      # is the correct behaviour for a vulnerability scan and is why it sits
      # beside the step that already reaches the registry.
      - name: supply chain, seeded-violation self-test
        working-directory: frontend
        run: node scripts/supply_chain_gate.mjs --self-test

      - name: supply chain, licences, install hooks, integrity and advisories
        working-directory: frontend
        run: node scripts/supply_chain_gate.mjs

      # ── Gate 1: type safety, regression-only ─────────────────────────────────
      # Fails if the error or warning count rises above the committed baseline.
      # See scripts/typecheck_baseline.mjs for why the baseline is not zero.
      - name: svelte-check (no new type errors)
        working-directory: frontend
        run: node scripts/typecheck_baseline.mjs

      # ── Gate 2: dead wiring ──────────────────────────────────────────────────
      # The standingMode class: state a control writes that nothing ever reads.
      # R043 PHASE 3d: readers now count only if their file is REACHABLE from
      # the shipped entry, and the seeded self-test (a store whose only reader
      # is a file nothing imports) runs first per convention (p).
      - name: dead wiring scan, seeded-violation self-test
        working-directory: frontend
        run: node scripts/dead_wiring_scan.mjs --self-test

      - name: dead wiring scan
        working-directory: frontend
        run: node scripts/dead_wiring_scan.mjs

      # ── Gate 3: integer micros ───────────────────────────────────────────────
      # CLAUDE.md makes integer micros mandatory with zero float tolerance.
      - name: wallet float scan
        working-directory: frontend
        run: node scripts/scan_wallet_floats.mjs

      # ── Gate 4: money-path constant duplication ──────────────────────────────
      # CURRENCY_SCALE exists in the canonical util and in locked rgsService.ts.
      # Read-only: this parses the locked file as text and never writes to it.
      - name: currency scale drift
        working-directory: frontend
        run: node scripts/currency_scale_drift.test.mjs

      # ── Gate 5: frontend costs vs the shipped maths package ──────────────────
      # fsModes.ts against games/future_spinner/library/publish_files/index.json,
      # the two sides being independently generated. Guards the buy-tier billing
      # bug class. Read-only against the locked maths package.
      - name: fsModes / index.json drift
        working-directory: frontend
        run: npx tsx src/lib/config/fsModes.drift.test.ts

      # M08 of reports/qa/session3/MECHANISMS.md. What the player is SHOWN must
      # be what the maths actually PAYS: every paid combination, the scatter
      # awards, and the max win figure printed in the rules, per mode, against
      # game_config.py and the published lookup tables.
      #
      # REQ-040 is held here because nothing else held it. Session 3's survey put
      # 79 requirements to seven squads and REQ-040 reached none of them: it was
      # in no mechanism and in no unreachable list, and was found by counting
      # rather than by reading. HIGH severity, player visible.
      - name: paytable parity, seeded-violation self-test
        working-directory: frontend
        run: npx tsx src/lib/config/paytable_parity.test.ts --self-test

      - name: paytable parity against the shipped maths
        working-directory: frontend
        run: npx tsx src/lib/config/paytable_parity.test.ts

      # ── Gate 6: locale completeness ──────────────────────────────────────────
      # Every required key in all 16 locales, and no unexplained hardcoded
      # player-facing literal in any component. Kills the class where 18 strings
      # rendered English in fifteen locales because the keys never existed.
      - name: locale completeness
        working-directory: frontend
        run: node scripts/locale_completeness_check.mjs

      # ── Gate 6a: accessibility strings are social-safe ───────────────────────
      # Screen-reader text is player-facing text. The visible-text sweep reads
      # rendered DOM text and therefore never saw aria-label/title/alt, which is
      # how 14 control labels shipped carrying the restricted phrase "bet": a
      # blind player in a social jurisdiction heard the real-money vocabulary a
      # sighted player was protected from. (R4 / TR-012)
      - name: a11y social terms
        working-directory: frontend
        run: node scripts/a11y_social_terms_check.mjs

      # ── Gate 6b: the social vocabulary layer ─────────────────────────────────
      # The static half of the social gate. It re-derives the prohibited-term
      # table from the dated jurisdiction mirror and fails if the module's copy
      # has drifted, exercises sv() including case preservation and word
      # boundaries, and reads the three surfaces R2R3 named out of the SHIPPED
      # component source rather than a copy. The full rendered-DOM scan needs
      # Playwright and a dev server and so stays local, per this workflow's
      # stated scope; its result is committed as
      # reports/qa/social_dom_conformance_2026-07-25.json. (R2R JOB 6 / TR-041)
      - name: social vocabulary
        working-directory: frontend
        run: npx tsx src/lib/i18n/vocabulary.test.ts

      # ── Gate 6c: the disclaimer, sixteen locales, both modes ─────────────────
      # M02 of reports/qa/session3/MECHANISMS.md. SEVEN platform requirements
      # (REQ-010 to REQ-015 and REQ-038) had no proof path and all seven are
      # properties of one artefact: the disclaimer prose.
      #
      # Nothing mechanical can check that sixteen translations convey six
      # meanings, so this asserts the STRUCTURAL invariants the real defect
      # breaks and which hold in any script: six sentences per locale (a dropped
      # clause drops the count) and the untranslated "Remote Game Server"
      # anchor. Meaning is checked in English only, against the platform's own
      # template read from the dated mirror at runtime, so a platform rewrite
      # goes red rather than being silently checked against a stale memory.
      #
      # REQ-016 is deliberately NOT held: it asks whether the template's closing
      # TM line is mandatory, NO_PROOF_SET.tsv records it UNKNOWN and says it
      # should be ruled, and it sits against the no-Stake-branding rule. A gate
      # cannot settle that. Self-test first, per convention (p): ten seeds, five
      # paired controls.
      - name: disclaimer conformance, seeded-violation self-test
        working-directory: frontend
        run: npx tsx src/lib/i18n/disclaimer_conformance.test.ts --self-test

      - name: disclaimer conformance, sixteen locales
        working-directory: frontend
        run: npx tsx src/lib/i18n/disclaimer_conformance.test.ts

      # ── Gate 7: no em or en dashes anywhere that can reach a player ──────────
      # Replaces player_string_dash_check.mjs, which passed twice while broken
      # (TR-060, then TR-063). The self-test runs FIRST and plants the four real
      # forms the old gate was blind to: if the gate cannot fail on a seeded
      # dash, its PASS means nothing. CLAUDE.md convention (p).
      - name: dash gate, seeded-violation self-test
        working-directory: frontend
        run: node scripts/dash_gate.mjs --self-test

      - name: dash gate, source scan
        working-directory: frontend
        run: node scripts/dash_gate.mjs --source

      # ── Gate 6d: the multiplication sign ─────────────────────────────────────
      # Charter row Q-26, closed 2026-07-30. Same family as the dash gate and for
      # the same reason: one glyph written two ways across surfaces a player sees
      # together is the machine-tell the standing mandate names. The class had no
      # gate until now, and its parked row undercounted itself by an order of
      # magnitude (four recorded, 51 real), so the self-test plants the defect in
      # prose.locales.ts, which is the file the old count never searched.
      - name: multiplication sign gate, seeded-violation self-test
        working-directory: frontend
        run: node scripts/multiplication_sign_gate.mjs --self-test

      - name: multiplication sign gate, prose scan
        working-directory: frontend
        run: node scripts/multiplication_sign_gate.mjs

      # ── Gate 7a: the machine-tell gate ───────────────────────────────────────
      # The second gate of the dash gate's family, added 2026-07-27 by the
      # quality sweep. CLAUDE.md's STANDING MANDATE ends "Nothing player-visible
      # may read as machine-generated" and its inspection test names the
      # specific failures; docs/QUALITY_CHARTER.md holds the full list and this
      # enforces the sweepable subset: emoji and dingbats typeset as icons,
      # scaffold placeholders, double spaces, one locale using both apostrophe
      # forms, a French elision missing its apostrophe, hardcoded currency
      # symbols, and player money rendered by .toFixed() outside the canonical
      # formatter.
      #
      # WHAT IT FOUND ON ITS FIRST RUN, so the gate's value is on the record:
      # 35 symbol glyphs shipping in dist, 31 of them player-visible, and
      # `<title>future-spinner-frontend</title>`, the Vite starter's own package
      # name, as the pre-hydration browser tab title (transient: App.svelte's
      # <svelte:head> replaces it on mount, which the first assessment missed).
      #
      # Self-test first, per convention (p). Every one of its ten seeds is a
      # string that was really in this repository at HEAD 3f0d686, in the file
      # shape it was found in, not an invented example of the class. Eight
      # negative controls, two of which encode corrections the gate's own first
      # real run forced.
      - name: machine tell gate, seeded-violation self-test
        working-directory: frontend
        run: node scripts/machine_tell_gate.mjs --self-test

      - name: machine tell gate, source scan
        working-directory: frontend
        run: node scripts/machine_tell_gate.mjs --source

      # ── Gate 8: authenticated bet ladder ─────────────────────────────────────
      # Both bet-changing surfaces must drive from the RGS-supplied levels. The
      # first three assertions reproduce the shipped defect arithmetically:
      # off the authenticated ladder, "+" dropped the bet to 0.10. (R5/TR-013)
      - name: bet ladder model
        working-directory: frontend
        run: npx tsx src/lib/stores/betLadder.test.ts
      # ── Gate 9: responsible-gambling enforcement ─────────────────────────────
      # Jurisdiction flags must be ENFORCED, not merely derived. turboDisabled
      # previously had zero readers anywhere: the flag was computed correctly and
      # every consumer ignored it, so a market banning fast play still got it.
      # (R7/TR-015)
      - name: responsible gambling enforcement
        working-directory: frontend
        run: npx tsx src/lib/stores/responsibleGambling.test.ts

      # ── Gate 10: modal safety and per-tier buy affordability ─────────────────
      # Blocking surfaces register themselves instead of being listed in
      # App.svelte, which could not see component-local state and so let the
      # spacebar spin under six of them. Affordability is checked against the
      # tier's real cost, not a flat 100x. (R8/TR-016)
      - name: modal guard and buy affordability
        working-directory: frontend
        run: npx tsx src/lib/stores/modalGuard.test.ts

      # ── Gate 10a: production mock containment (source half) ──────────────────
      # rgsService falls through to _mockSpin() when _rgsMode is false, which it
      # sets on a real auth failure as well as the dev case. The bundle half of
      # this gate needs a build and runs in the closing suite. (R2/TR-010)
      - name: live guard
        working-directory: frontend
        run: npx tsx src/lib/stores/liveGuard.test.ts

      # ── Gate 10b: session recovery ───────────────────────────────────────────
      # authenticate reports an in-progress round and initRGS discarded it. On a
      # pending_end round that is an uncredited win. (R11/TR-017)
      - name: session recovery
        working-directory: frontend
        run: npx tsx src/lib/stores/sessionRecovery.test.ts

      # ── Gate 10b.i: feature resume, the cursor model ─────────────────────────
      # TR-099. What is persisted is an INDEX, never a figure, so a forged or
      # stale cursor can at worst skip part of an animation. These are the
      # REFUSALS: wrong round, wrong checksum, out of range, wrong version,
      # unreadable storage. Each asserts WHICH guard fired, because a validator
      # that rejects everything for the wrong reason passes a boolean test and
      # is still broken.
      - name: feature resume, checkpoint model
        working-directory: frontend
        run: npx tsx src/lib/stores/presentationCheckpoint.test.ts

      # ── Gate 10b.ii: feature resume, the flow ────────────────────────────────
      # The two orderings the design turns on, asserted by call sequence rather
      # than by independent spies: the offer is made BEFORE anything is
      # presented, and the round is presented BEFORE it is settled, resumed or
      # not.
      - name: feature resume, recovery flow
        working-directory: frontend
        run: npx tsx src/lib/stores/featureResume.test.ts

      # ── Gate 10c: scatter anticipation integrity ─────────────────────────────
      # The escalation level must be a function of VISIBLE state only. The test
      # asserts, among other things, that two rounds identical so far escalate
      # identically however they end - which is the property that makes the
      # build honest rather than a tell.
      - name: scatter anticipation
        working-directory: frontend
        run: npx tsx src/lib/stores/scatterEscalation.test.ts

      # ── Gate 10d: official launch parameters ─────────────────────────────────
      # The official launch sends sessionID; App.svelte read only `session`, so a
      # real launch authenticated with a dev token, failed, and the live guard
      # then correctly refused to bet. Unplayable on a real URL. (R2R blocker 1)
      - name: launch params
        working-directory: frontend
        run: npx tsx src/lib/stores/launchParams.test.ts

      # ── Gate 11: live event schema alignment ─────────────────────────────────
      # The locked parser looked for board/win/scatter events. Across the first
      # 300 shipped base rounds those occur 0, 0 and 0 times, while reveal occurs
      # 724 times. Asserted against real decoded book rows. (R1a/TR-009)
      - name: rgs parse alignment
        working-directory: frontend
        run: npx tsx src/lib/services/rgsService.parse.test.ts

      # ── Gate 11a: official wallet contract ───────────────────────────────────
      # Every raw shape in rgsService.ts was invented: flat authenticate, flat
      # play, an end-round that sent and read a roundId the platform neither
      # accepts nor returns, and an rgs_url used unprefixed so requests never
      # left our own origin. Asserted against fixtures transcribed from the
      # pinned ts-client (df9e126), importing the real functions rather than
      # restating them. (R2R JOB 4 / TR-039, TR-042)
      - name: wallet contract
        working-directory: frontend
        run: npx tsx src/lib/services/rgsService.contract.test.ts

      # ── Gate 12: currency display contract ───────────────────────────────────
      # Static subset of the currency conformance harness: no browser, no dev
      # server. Asserts the raw platform code is never player-facing, trailing
      # SC/GC placement per ruling 2, zero-decimal currencies, and no US$ prefix.
      - name: currency static assertions
        working-directory: frontend
        run: npx tsx src/lib/utils/currency.test.ts

      # ── S2-C116: a round's SHAPE must not depend on the wallet ──────────────
      # Placed beside the currency gates so a red check names the concern, but
      # it is a different claim from all of them: those assert that money is
      # DISPLAYED correctly, this asserts that round-shaping logic never READS
      # currency at all. A branch that behaves differently for XSC than for EUR
      # is a fairness defect rather than a display one.
      #
      # The property already holds, so this gate is a regression guard and its
      # whole value is the seed. It strips comments and string literals before
      # it looks, because sessionRecovery.ts names currency once in a comment
      # and a naive scan flags that; the real run ships that line as a negative
      # control.
      - name: round logic currency, seeded-violation self-test
        working-directory: frontend
        run: node scripts/round_logic_currency_gate.mjs --self-test

      - name: round-shaping logic never reads currency
        working-directory: frontend
        run: node scripts/round_logic_currency_gate.mjs

      # ── Gate 12b: the currency TABLE against the platform mirror ─────────────
      # Until 2026-07-29 fiat symbols were derived from Intl. Measured against
      # the platform's own published Example column, 34 of 49 supported codes
      # rendered something else, and eight of them showed the player A DIFFERENT
      # CURRENCY'S SYMBOL: a bare `$` on CAD, MXN, SGD, TWD, CLP, ARS and NZD
      # balances, and `¥`, the Japanese yen sign, on CNY. The fix was a written
      # table (currency.ts PLATFORM_CURRENCIES); this gate is what stops it
      # drifting from the platform again.
      #
      # It parses docs/stake-engine-live/2026-07-29/rgs.md at run time rather
      # than restating the platform's numbers, so the gate's input and the
      # implementation's input are independent per convention (l.4). A gate
      # holding its own copy of the 49 rows would agree with the table by
      # construction and prove nothing.
      #
      # THE SELF-TEST IS ITS OWN STEP AND RUNS FIRST, per convention (p) and the
      # ordering the brief specifies. Six seeded defects, each a real edit to a
      # real copy of the module imported through the real path, the first of
      # which (`CAD: '$'`) is byte-for-byte what actually shipped. Plus a paired
      # positive for the whole set and one for every negative control, because a
      # control that can never fire is indistinguishable from one that passes.
      - name: currency table, seeded-violation self-test
        working-directory: frontend
        run: node scripts/currency_table_gate.mjs --self-test

      - name: currency table against the platform mirror
        working-directory: frontend
        run: node scripts/currency_table_gate.mjs

      # ── Gate 12c: the bet ladder is declared once, in three places ───────────
      # This game declares its bet ladder three times, in three languages:
      # game_config.py's bet_levels, the PUBLISHED game_metadata.json, and the
      # frontend BET_LEVELS fallback. Two of the three are inside a locked path,
      # so the cheapest edit is the unlocked one and it is the wrong one: a
      # reviewer reads the published metadata, not the Svelte constant.
      #
      # REQ-124 (offer levels from $0.01) is PARKED at a 0.10 floor, derivation
      # at reports/qa/session4b/REQ124_LADDER_DERIVATION.md. This gate is what
      # makes that park safe: it goes red on any ONE-SIDED widening, including
      # the exact edit the 2026-07-29 lock sanction would have produced had the
      # derivation warranted taking it. Its negative control proves a CONSISTENT
      # widening across all three stays green, so the gate does not block the fix
      # it exists to protect.
      #
      # READ-ONLY against the locked package: both locked files are parsed as
      # text and JSON, exactly as currency_scale_drift.test.mjs already parses
      # the locked rgsService.ts. No lock sanction is needed to run it.
      - name: bet ladder declaration drift, seeded-violation self-test
        run: node scripts/qa/bet_ladder_declaration_drift.mjs --self-test

      - name: bet ladder declaration drift
        run: node scripts/qa/bet_ladder_declaration_drift.mjs

      # ── Gate 12a: social mode forces English ─────────────────────────────────
      # Stake Engine testing guideline item 46, quoted: "English is the only
      # supported language in Social Mode". It is written as a requirement on
      # the game, so the game enforces it rather than trusting the platform to
      # only ever send `en`. TR-067: the social flag selected the VOCABULARY
      # variant and never touched the LOCALE, so a social session launched with
      # lang=de rendered German chrome wearing social wording. The named case is
      # a social `da` launch, which exercises the forcing and the
      # unshipped-locale fallback at once, Danish being offered by the
      # platform's own Language menu and not one of our sixteen (TR-059).
      # The browser half lives in scripts/locale_launch_conformance.mjs.
      - name: social mode forces English
        working-directory: frontend
        run: npx tsx src/lib/stores/socialLocale.test.ts

      # ── Gate 13: replay through the canonical interpreter ────────────────────
      # ReplayMode used the canonical interpreter only for freeSpinTrigger
      # rounds and searched every ORDINARY round for board/win/scatter, which
      # occur zero times in the shipped books, so a loss or a base win replayed
      # as an empty static grid. Mandatory platform requirement. Asserted over
      # five categories in every mode that has them, against real book rounds
      # committed as fixtures, plus a source scan proving the legacy search has
      # not come back. (R2R JOB 5 / TR-040)
      - name: replay rounds
        working-directory: frontend
        run: npx tsx src/lib/services/replayRounds.test.ts

      # The REPLAY route is a separate surface from the game route: App.svelte
      # branches to ReplayMode instead of the game tree, so the social
      # English-only enforcement applied at App boot does not reach it. Both
      # parseReplayParams and ReplayMode's eager first-paint block used to read
      # `lang` raw. A social replay still rendered an ENGLISH disclaimer, because
      # that one key carries a social override, which is what made it look
      # correct; the buttons and money readouts underneath rendered German.
      # Drives parseReplayParams itself, not the resolver, since the resolver was
      # never the broken part. (2026-08-09)
      - name: replay locale, social English only
        working-directory: frontend
        run: npx tsx src/lib/services/replayLocale.test.ts

      # Published item "Game displays sub-cent payouts correctly". Our smallest
      # paying combination is 0.08x, under the 0.1x threshold in rgs.md:295, so
      # four points of precision are required. At the 1 cent minimum bet that
      # combination pays $0.0008 and used to render "$0.00". Guards three things
      # at once: sub-cent exactness, ordinary wins NOT gaining decimals, and the
      # trailing-symbol placement surviving the widening. (2026-08-09)
      - name: win precision, sub-cent payouts
        working-directory: frontend
        run: npx tsx src/lib/utils/winPrecision.test.ts

      # Sixteen locales ship and locale_prose_conformance proves every KEYED
      # string resolves in all of them. That says nothing about a literal typed
      # straight into markup: an unkeyed string is not a missing translation, it
      # is not a translation at all, and no completeness check can see one.
      # Eleven were found by hand in the pre-submission hunt. They need real
      # translation in fifteen locales, so the known set is FROZEN and the gate
      # fails on anything new, in both directions.
      - name: hardcoded player-facing strings
        working-directory: frontend
        run: node scripts/hardcoded_string_gate.mjs --self-test && node scripts/hardcoded_string_gate.mjs

      # ── Gate 1a: the COMPLETE type-check, not just the Svelte half ───────────
      # R2R3 finding 9 / TR-046: "npm run check reports 0 Svelte errors, 36
      # warnings and vite.config.ts:33 TS7006. CI runs only the Svelte baseline,
      # so TR-018's 'baseline is zero and CI enforces it' is incomplete." It was
      # right: gate 1 runs typecheck_baseline.mjs, which is svelte-check alone,
      # and the tsc half of `npm run check` had been red the whole time. The
      # TS7006 is fixed and the whole command now runs here, so the claim and
      # the gate finally agree.
      - name: npm run check (svelte-check AND tsc)
        working-directory: frontend
        run: npm run check

      # ── Gate 1b: the production build ────────────────────────────────────────
      # Also R2R3 finding 9, which asked for "the complete command green and run,
      # plus a production build, in CI". A build catches what no type-check can:
      # a broken import chain, a missing asset, a plugin that throws at
      # closeBundle. It is also what every Playwright proof that serves `dist`
      # depends on existing, so a build failure here is a failure of half the
      # evidence pipeline.
      - name: production build
        working-directory: frontend
        run: npm run build

      # ── Gate 13b: the dash gate's dist scan ──────────────────────────────────
      # Runs after the build because dist is the authority: it catches a dash
      # however it was authored, including in a public asset that no scan of
      # src/ could ever see. Its first run found 17 in a shipped sounds README.
      - name: dash gate, dist scan
        working-directory: frontend
        run: node scripts/dash_gate.mjs

      # ── Gate 13b2: the machine-tell gate's dist scan ─────────────────────────
      # Same reasoning as the dash gate's dist scan directly above: dist is the
      # authority because a glyph is a glyph however it was authored, and the
      # tab title is read straight out of the shipped HTML rather than inferred
      # from the source that produced it.
      - name: machine tell gate, dist scan
        working-directory: frontend
        run: node scripts/machine_tell_gate.mjs

      # ── Gate 13b3: the kit basis gate (R043 PHASE 1e) ────────────────────────
      # The discovery method that found OWNER_RULINGS section K, kept as an
      # instrument: section K's surviving old-basis string was found by grepping
      # the BUILT kit for the German word the A3 ruling had just removed, not by
      # any source gate, because a claim's basis is meaning rather than form.
      # Greps dist (the kit payload) for every superseded per-locale basis
      # phrase, and evaluates the live tables for en-form figures in the ten
      # comma-decimal locales, locating any hit in the kit bytes. After the
      # build, deliberately: dist is what ships.
      - name: kit basis gate, seeded-violation self-test
        working-directory: frontend
        run: npx tsx scripts/kit_basis_gate.mjs --self-test

      - name: kit basis gate, superseded basis words and en-form figures
        working-directory: frontend
        run: npx tsx scripts/kit_basis_gate.mjs

      # Gates 13c and 13d (layout fit, contrast) live in the "browser gates"
      # job below: they launch chromium, which this job deliberately does not
      # install. See the header for the two-job policy.

      # ── Gate 13e: no documentation ships ─────────────────────────────────────
      # JOB 3(i). vite.config.ts's pruneDocs deletes documentation from dist at
      # closeBundle; this asserts it is not there, and the two are deliberately
      # separate. A plugin that stops running, or has a path edited, fails
      # silently and the bundle quietly carries the file again, which is how
      # build_diet_verify.mjs sat broken for ten days while its committed result
      # was cited as compliance evidence. This reads dist as it stands and knows
      # nothing about how it got that way.
      #
      # What was shipping: an audio generation-notes README naming the model,
      # the seeds, the prompts and the licence paths, served from the portal in
      # the owner's own 104-file listing. Ships a seeded violation whose first
      # seed is that exact path. Also re-records the bundle figure against the
      # 25 MB budget, so the number in the report is one this script computed.
      # ── Asset references resolve (JOB 1, 2026-07-28) ─────────────────────────
      # AFTER the production build above, deliberately. Both legs read dist/:
      # the gate compares references against it, and the self-test's negative
      # control asserts a real shipped asset IS present. Placed before the build
      # on the first attempt, they went red in CI on the negative control while
      # passing locally, which is the layout_fit_gate placement failure this
      # workflow's own header records: a gate must run in an environment that
      # can execute it, or its placement is the failure.
      - name: asset references, seeded-violation self-test
        working-directory: frontend
        run: node scripts/asset_reference_gate.mjs --self-test

      - name: asset references resolve in dist
        working-directory: frontend
        run: node scripts/asset_reference_gate.mjs

      - name: dist hygiene, no documentation ships
        working-directory: frontend
        run: node scripts/dist_hygiene_gate.mjs

      # ── S2-C010: no Stake brand token in any FILE NAME ──────────────────────
      # The companion to dist_hygiene_gate.mjs's Stake branding block, which
      # scans file CONTENT in dist. This scans file NAMES across dist, the
      # frontend source and the brand design system. Two sessions disagreed over
      # whether the row was already covered; it was covered by half. Its token
      # rules are stated independently of the content scan's, per convention
      # (l.4), because two predicates sharing one list corroborate nothing and
      # because a file name has no vocabulary layer around it: the filename trap
      # is that `stake` is a substring of mistake and stakeholder, so the match
      # is whole-token.
      #
      # AFTER the production build, deliberately, for the same reason the asset
      # reference pair above is: dist is one of its three roots and a missing
      # root exits non-zero rather than skipping.
      - name: brand tokens in file names, seeded-violation self-test
        working-directory: frontend
        run: node scripts/brand_token_gate.mjs --self-test

      - name: no Stake brand token in any shipped or source file name
        working-directory: frontend
        run: node scripts/brand_token_gate.mjs

      # ── S2-C037: a Stake mark EMBEDDED IN THE BYTES of a shipped asset ──────
      # The third member of the brand family and the only one that reads binary.
      # brand_token_gate reads file NAMES; dist_hygiene reads shipped TEXT; this
      # reads the bytes of images and audio, where an export tool's PNG tEXt
      # chunk, JPEG EXIF field or MP3 ID3 tag can carry a studio or platform
      # name that no text scan of source or bundle can ever see, and that a
      # reviewer unzipping the upload would.
      #
      # The row also asked for a source-side TEXT scan. That was REFUSED with
      # two measurements recorded in the gate's own header: player strings reach
      # the bundle, so dist_hygiene already sees them, and stripping comments
      # from src leaves zero brand hits because all eight are correct prose
      # about the stake.us jurisdiction rules.
      #
      # AFTER the production build, like its siblings: dist is its only root.
      - name: embedded stake marks, seeded-violation self-test
        working-directory: frontend
        run: node scripts/stake_mark_gate.mjs --self-test

      - name: no Stake mark embedded in any shipped asset
        working-directory: frontend
        run: node scripts/stake_mark_gate.mjs

      # ── S2-C035: no prohibited mechanic ships ───────────────────────────────
      # CLAUDE.md's Compliance section claims the game is stateless with "no
      # jackpot, gamble, continuation, early cashout, cross-round state". That
      # claim reaches a reviewer in the dossier and was held by nothing.
      #
      # Three assertions, because a prohibited mechanic arrives by three doors:
      # the MODE SET (fsModes serverMode against game_config.py BetModes, which
      # is a different pair from the existing fsModes/index.json drift gate and
      # makes the agreement three-way), shipped player TEXT, and the CONTROL
      # inventory in source.
      #
      # The gamble rule is deliberately narrow. Its first draft flagged
      # `gamblingLimitReached`, which is REQUIRED responsible-gambling wording,
      # and a gate that pressures someone to delete a mandatory disclaimer is
      # worse than no gate. That message ships as a negative control.
      - name: prohibited mechanics, seeded-violation self-test
        working-directory: frontend
        run: node scripts/prohibited_mechanic_gate.mjs --self-test

      - name: no prohibited mechanic ships
        working-directory: frontend
        run: node scripts/prohibited_mechanic_gate.mjs

      # ── Gate 13f: the submission delivery set ────────────────────────────────
      # M03 of reports/qa/session3/MECHANISMS.md. EIGHT platform requirements
      # (REQ-164, 169, 170, 171, 172, 173, 174, 176) with no proof path, all of
      # them properties of one read-only walk of design-system/brand/delivery/
      # plus the kit payload layout.
      #
      # It DECODES the PNG alpha plane rather than reading the header, because
      # "a genuine alpha channel" is not a colour type: a PNG can be RGBA with
      # every alpha byte at 255, which is an opaque image wearing an alpha
      # channel and is exactly what "save as PNG" from a flattened composite
      # produces. That file passes any header check and then covers the
      # background at the platform. IHDR, IDAT, one inflate and the five
      # scanline filters, about sixty lines, no image dependency in CI.
      #
      # REQ-174 is measured as alpha COVERAGE RETENTION at tile size, which is
      # the mechanism behind the requirement's own stated concern about thin
      # strokes, and the gate says plainly that this is not a legibility score.
      # Measured on the shipped mark: 100.1% retention against a 50% floor.
      #
      # AFTER the production build, deliberately: the REQ-176 half reads dist,
      # and its negative control proves an ABSENT dist is not reported as a
      # breach, so the placement is checked rather than assumed.
      - name: delivery set, seeded-violation self-test
        run: node scripts/qa/delivery_set_gate.mjs --self-test

      - name: delivery set conformance
        run: node scripts/qa/delivery_set_gate.mjs

      # ── Gate 14: the books verifier fails closed ─────────────────────────────
      # Run at HEAD with the private books absent, the verifier produced five
      # `zstd: can't stat` errors, processed zero rounds, made zero assertions
      # and printed PASS. The books are gitignored, so that is what EVERY
      # reviewer working from this repository got. The self-test runs the tool
      # against absent input and asserts a non-zero exit, which is the one proof
      # that cannot rot, and it needs no books, so it belongs in CI where the
      # books are always absent. (R2R JOB 7 / TR-044)
      - name: books verifier self-test
        run: python3 tools/verify_books_lookup_equality.py --self-test

  # The second job of the two-job policy (see header). Only the gates that
  # launch chromium live here. Blocking, no secrets, contents:read only, same
  # pull_request trigger, exactly like the static job.
  # timeout-minutes is 10 on Fable's mid-session direction after run 122: the
  # layout gate finished its work in 13 seconds, printed PASS, and then hung
  # for 18 minutes because killing its npx wrapper orphaned the vite preview,
  # whose inherited stdout pipe held the node event loop open. Both gates now
  # also carry a 4-minute internal watchdog and an explicit process.exit, so a
  # hang is a loud red at three layers before a human has to cancel anything.
  # timeout-minutes raised 10 to 20 by FS VISUAL FIXPACK, which adds three
  # browser gates and their three self-tests. Measured locally: splash calm 70s
  # plus 31s self-test, turbo intensity 20s plus 10s, paytable card fill 55s
  # plus 9s, so about 3.3 minutes of new work on a machine faster than the
  # runner. The 10-minute figure was set after run 122's hang, and raising it
  # does not weaken that: each of these gates carries its OWN internal watchdog
  # (4 to 8 minutes) that exits red, which is the level the run-122 note itself
  # argues a hang should be caught at. The job timeout is the last resort, not
  # the first.
  # ── THE BROWSER GATES, ONE JOB PER GATE ─────────────────────────────────────
  #
  # A MATRIX since 2026-07-28, and the reason is a measurement that corrected an
  # assumption. Caching chromium was expected to be the win; it is worth about 80
  # seconds and the job stayed at 6.4 minutes, because the chromium install was
  # never the dominant cost. Per-step timings from run 30280722398:
  #
  #   setup (checkout, node, npm ci, cache restore, install-deps, build)   ~60s
  #   scrim coverage        96s + 8s self-test        = 104s
  #   splash calm           65s + 29s self-test       =  94s
  #   paytable card fill    48s + 7s self-test        =  55s
  #   turbo intensity       17s + 7s self-test        =  24s
  #   contrast              19s
  #   layout fit            15s
  #   win count-up          1s + 2s self-test         =   3s
  #                                             gates  = 314s, i.e. 5 of the 6.4
  #
  # The gates are independent by construction: each spawns its OWN vite preview
  # on its OWN free port and shares no state. So they parallelise cleanly, and
  # wall-clock becomes setup plus the SLOWEST gate rather than setup plus the
  # sum, about 2.7 minutes instead of 6.4.
  #
  # THE COST, stated rather than hidden: each leg repeats the ~60s of setup, so
  # total runner minutes go UP even though wall-clock goes down. That is the
  # right trade here because this repository is public and runner minutes are
  # free, while a person waiting on a push is not.
  #
  # A leg is named for its gate, so a red check in the list names the failure
  # without anyone opening the log. Same security posture as the static job: no
  # secrets, contents:read, pull_request rather than pull_request_target.
  browser:
    name: ${{ matrix.gate.name }}
    needs: changes
    # Skipped only when `changes` proved the push touches no rendering, shipping
    # or gate code. That job fails open, so a skip here is a positive result and
    # never an accident.
    if: needs.changes.outputs.browser_needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # One failing gate must not cancel the others: a session wants the WHOLE
      # picture from one run, not the first thing that broke.
      fail-fast: false
      matrix:
        gate:
          - name: "browser: layout fit"
            # S2-C024: this leg ran BARE until 2026-08-05, alone with contrast
            # among the twelve, because the gate had no self-test to run. It now
            # seeds a renamed testid and a display:none readout into a scratch
            # copy of the real dist and requires both reds.
            run: node scripts/layout_fit_gate.mjs --self-test && node scripts/layout_fit_gate.mjs
          - name: "browser: contrast"
            run: node scripts/contrast_gate.mjs
          - name: "browser: splash calm"
            run: node scripts/splash_calm_gate.mjs --self-test && node scripts/splash_calm_gate.mjs
          - name: "browser: turbo intensity"
            run: node scripts/turbo_intensity_gate.mjs --self-test && node scripts/turbo_intensity_gate.mjs
          - name: "browser: paytable card fill"
            run: node scripts/paytable_card_fill_gate.mjs --self-test && node scripts/paytable_card_fill_gate.mjs
          - name: "browser: scrim coverage"
            run: node scripts/scrim_coverage_gate.mjs --self-test && node scripts/scrim_coverage_gate.mjs
          - name: "browser: win count-up steady"
            run: node scripts/win_countup_steady_gate.mjs --self-test && node scripts/win_countup_steady_gate.mjs
          # MID-01, Fable's ruling: the banner and the WIN pod are driven from one
          # shared count-up source with frame-level equality asserted. This is a
          # DIFFERENT claim from the steady gate above, which is about the GEOMETRY
          # of the digits as they roll; this one is about the VALUE the two
          # surfaces show at the same instant, and about the celebration not being
          # beaten to its own reveal by the HUD.
          - name: "browser: win count-up sync"
            run: node scripts/win_countup_sync_gate.mjs --self-test && node scripts/win_countup_sync_gate.mjs
          # The slowest leg by design: it holds a real capped round for thirty
          # seconds, which is the owner's own figure and the whole point of the
          # assertion. The seeded runs watch for twelve seconds each, because
          # both seeds fire at four and the detector is what is being proved.
          - name: "browser: max-win hold"
            run: node scripts/max_win_hold_gate.mjs --self-test && node scripts/max_win_hold_gate.mjs
          # Runs WITHOUT FS_WRITE_EVIDENCE, so it captures to scratch and cannot
          # rewrite the committed evidence under reports/screens/bet-selector/.
          # Convention (h.1).
          - name: "browser: bet selector"
            run: node scripts/bet_selector_gate.mjs --self-test && node scripts/bet_selector_gate.mjs
          # TR-101, Fable's ruling option (c). Proves the in-process replacement
          # for `vite preview` actually serves the bundle to a real browser, and
          # that the post-run assertion goes RED on a seeded leaked child.
          - name: "browser: preview server"
            run: node scripts/preview_server_gate.mjs --self-test && node scripts/preview_server_gate.mjs
          # TR-111. The network-hygiene gate the SUBMISSION DOSSIER cites at its
          # section 5a, and which two external reviews graded a requirement PASS
          # on. It was never a CI step, and it had been throwing at
          # `preview.kill()` in its own finally block since the TR-101 migration,
          # so it reached none of its assertions and had been seen neither to
          # pass NOR to fail. Wiring it without the self-test would have carried
          # that forward; the self-test's NEGATIVE control is the half that
          # catches a gate which throws, because it demands the real PASS line
          # rather than merely exit 0.
          #
          # THIS LEG IS THREE GATE RUNS, not two: `--self-test` drives a clean
          # browser session and a seeded one before the real run. Measured at
          # 18.4 seconds for all three together on the development machine,
          # 2026-07-31, by `time` over this exact command. That is cheap enough
          # that it is not expected to set the wall clock, but judge it against
          # the range in CLAUDE.md protocol rule 10 rather than against 18.4:
          # runner contention is what moves these figures, not the gate.
          # RENAMED 2026-07-31, and RENAMED BACK 2026-08-05 by S2-C058 now that the
          # capability the name claims actually exists.
          #
          # The 2026-07-31 note is kept because it is the discipline that earned
          # this: the leg was "browser: build diet network hygiene", which asserted
          # by its name the one capability Session 6 proved the gate lacked, and a
          # green leg with that name is stronger false assurance than the stale
          # hand-run log it replaced. So the NAME was withheld until the assertion
          # was real, rather than the assertion being assumed from the name.
          #
          # It now tests request origin. A successful off-origin 200 was exempt and
          # is not: the seeded fonts.googleapis.com stylesheet returns status 200,
          # with notFound 0 and failed 0, and the gate goes red naming the origin.
          - name: "browser: build diet, network hygiene and budget"
            run: node scripts/build_diet_verify.mjs --self-test && node scripts/build_diet_verify.mjs
          # M01 of reports/qa/session3/MECHANISMS.md. ELEVEN platform
          # requirements had no proof path and ten of them are properties of one
          # observable: what the shipped bundle DOES at a replay URL. Bet Replay
          # is mandatory, so this is the highest-consequence gap Session 2 found.
          # The eleventh, REQ-132 event ordering, is asserted on the interpreter
          # in the wired "replay rounds" step instead, because the browser can
          # see that a total was rendered but never which event decided it.
          - name: "browser: replay contract"
            run: node scripts/replay_contract_gate.mjs --self-test && node scripts/replay_contract_gate.mjs

          # layout_fit_gate measures the GAME route at seven presets and never
          # touched the REPLAY route, because App.svelte branches to ReplayMode
          # INSTEAD of the game tree. At Popout S the replay grid therefore
          # shipped at its natural 616px inside a 400px viewport, 64.9 per cent
          # visible, centred, so no scroll position showed all five reels. This
          # measures the same seven presets on the other route, and asserts the
          # replay can actually be STARTED at each of them. It serves its own
          # canned round because the grid only mounts once a replay loads: a
          # probe with no RGS behind it reports a clean run over nothing.
          - name: "browser: replay fit"
            run: node scripts/replay_fit_gate.mjs --self-test && node scripts/replay_fit_gate.mjs

          # R043 PHASE 3c, fresh-context majors 1, 2 and 6. The gate two other
          # artefacts cited as their proof was RED at HEAD (a broken import
          # threw at module load) and wired into nothing. Its PART 3 now opens
          # the real paytable through the HUD menu route before harvesting, so
          # the rules, the interface guide and the disclaimer, the block its
          # own comment names, are actually read. tsx, not node: it evaluates
          # the live TypeScript locale modules.
          - name: "browser: locale prose conformance"
            run: npx tsx scripts/locale_prose_conformance.mjs --self-test && npx tsx scripts/locale_prose_conformance.mjs

          # R043 PHASE 4, blocker B12: a live settle failure fails CLOSED on
          # money. Stub wallet accepts play and refuses end-round; the proof
          # asserts no refund on assumption, the settle-failed guard and its
          # German banner, SPIN blocked at every route, the reload settling
          # through recovery, and micros-exact per-mode debits. The self-test
          # seeds the superseded refund-on-rejection source itself.
          - name: "browser: live settle failure"
            run: npx tsx scripts/r043_settle_failure_proof.mjs --self-test && npx tsx scripts/r043_settle_failure_proof.mjs

          # TR-123 (COMMS 046/047), wired 2026-08-11. These three printed their
          # verdict then never exited, because the npx wrapper's surviving vite
          # grandchild held the process open on its inherited pipes, so they
          # could not be wired until the exit was fixed. Each now exits 0 on
          # PASS and non-zero on FAIL, kills its server as a process group, and
          # its --self-test re-invokes the gate with FS_SEED_VIOLATION=1 and
          # demands BOTH the red verdict AND a real non-zero exit within a
          # timeout, so the lingering-handle class is itself machine-caught if
          # it returns. tsx, not node: social_dom evaluates the live TypeScript
          # vocabulary module, and one documented runner covers the family
          # (frontend/scripts/README.md).
          - name: "browser: popout conformance"
            run: npx tsx scripts/popout_conformance.mjs --self-test && npx tsx scripts/popout_conformance.mjs
          - name: "browser: social DOM conformance"
            run: npx tsx scripts/social_dom_conformance.mjs --self-test && npx tsx scripts/social_dom_conformance.mjs
          - name: "browser: social string conformance"
            run: npx tsx scripts/social_string_conformance.mjs --self-test && npx tsx scripts/social_string_conformance.mjs

          # R046 TASK 0, ordered by Fable: the R045 proof joins the matrix under
          # the TR-123 runner contract. Its exit semantics were proven at birth
          # (the self-test re-invokes the gate with the dual read regressed in a
          # scratch copy of the real bundle and demands the red verdict AND a
          # real non-zero exit), so unlike the three siblings above it never had
          # a lingering-handle era to escape.
          - name: "browser: rgs error dialect"
            run: npx tsx scripts/r045_error_field_proof.mjs --self-test && npx tsx scripts/r045_error_field_proof.mjs

          # R057 TASK 1 (checklist item 02): an invalid rgs_url fails loudly
          # and safely. Refused-port launch, keyed banner en+de, a press puts
          # nothing on the wire; seeded by severing the auth-failed guard in a
          # scratch copy of the real bundle. Same TR-123 exit contract as the
          # dialect proof beside it.
          - name: "browser: invalid rgs_url guard"
            run: npx tsx scripts/r057_invalid_rgs_proof.mjs --self-test && npx tsx scripts/r057_invalid_rgs_proof.mjs

          # R047 TASK 5 (TR-129): the two-step autoplay property joins the
          # matrix, both halves. The confirm gate proves the CODE cannot start
          # a bet from a selection handler (static, seeded); the r042b proof
          # counts WALLET CALLS through the behaviour a player meets, its
          # self-test planting the one-click class at the DOM boundary and
          # demanding the red AND the non-zero exit. Round 4's reviewer A
          # observed the property was proven once and enforced never; this
          # closes that.
          - name: "browser: autoplay confirm gate"
            run: npx tsx scripts/check_autoplay_confirm_gate.mjs --self-test && npx tsx scripts/check_autoplay_confirm_gate.mjs
          - name: "browser: autoplay two-step proof"
            run: npx tsx scripts/r042b_autoplay_proof.mjs --self-test && npx tsx scripts/r042b_autoplay_proof.mjs

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts

      # THE KEY IS THE RESOLVED VERSION, NOT THE RANGE. package.json says
      # `^1.61.1` and package-lock.json already resolves to 1.62.0, so keying on
      # the range would serve a chromium build against a different driver, and
      # the failure mode of THAT is a browser that launches and behaves subtly
      # differently, which is far worse than a slow job. The lockfile is the
      # same file `npm ci` obeys, so a bump invalidates the key automatically.
      - name: Resolve the Playwright version
        id: pw
        working-directory: frontend
        run: |
          V=$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Playwright resolved to $V"

      - name: Cache the chromium browser
        id: pwcache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # ON A MISS, do exactly what this job did before the cache existed, so the
      # worst case is the old behaviour rather than a new failure. --with-deps
      # also installs the OS libraries, which do NOT live in the cached path.
      - name: Install chromium (cache miss)
        if: steps.pwcache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npx playwright install chromium --with-deps

      # ON A HIT the binary is restored but the OS libraries are not, because
      # they install into the system rather than into ~/.cache. Measured at 12s
      # against roughly 90s for the full install, and that gap is the whole
      # value of the cache. Do not "simplify" these two steps into one.
      - name: Install chromium OS dependencies (cache hit)
        if: steps.pwcache.outputs.cache-hit == 'true'
        working-directory: frontend
        run: npx playwright install-deps chromium

      # Every gate serves dist via vite preview, so the build must exist first.
      # The static job builds too; duplicating it keeps the jobs independent,
      # which is the point of the split.
      - name: production build
        working-directory: frontend
        run: npm run build

      # The gate itself. Each leg carries its own convention (p) seeded self-test
      # FIRST where it has one, because a gate and the proof that it can fail are
      # two results rather than one, and the self-test running first means a
      # broken gate reports as broken rather than as green.
      - name: ${{ matrix.gate.name }}
        working-directory: frontend
        run: ${{ matrix.gate.run }}
